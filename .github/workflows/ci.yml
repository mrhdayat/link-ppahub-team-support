name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Throwaway, CI only. No DATABASE_URL: the app uses the local file store.
      ADMIN_PASSWORD: ci-only-password-not-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # LayoutProps/PageProps are generated; a fresh checkout has none until typegen (or a build) runs.
      - run: npx next typegen
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - name: Smoke e2e + CSP
        env:
          BASE: http://localhost:3130
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx next start -p 3130 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$BASE/" && break; sleep 1; done
          node scripts/smoke.mjs
      - name: Server log
        if: failure()
        run: cat server.log || true
